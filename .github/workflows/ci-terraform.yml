name: ci-terraform

# Credential-free init and validate of every component except bootstrap's
# backend, through the shared workflow, which owns the path filter and the
# always-reporting gate that becomes "terraform / Terraform".
#
# No credentialled plan on pull requests, deliberately, as in github-repos: the
# only identity that can read everything these components manage is the apply
# identity, and branch code never gets it (its federated credential trusts the
# main-only `apply` environment alone). The real plan is cd-terraform's, posted
# in the `terraform-pending` issue for each component after merge.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # pull-requests: read is what the shared workflow's path filter needs; the
  # filter runs inside that workflow, so the permission is granted from here.
  terraform:
    permissions:
      contents: read
      pull-requests: read
    uses: jay-withers/workflows/.github/workflows/terraform.yml@058b978a7ace81ab39031ba2397cac9d526cd4a7 # v1.22.1
    with:
      directories: >-
        ["terraform/bootstrap", "terraform/management", "terraform/governance",
        "terraform/connectivity", "terraform/landingzones"]
