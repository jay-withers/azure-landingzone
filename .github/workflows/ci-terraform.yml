name: ci-terraform

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Detects whether this PR touches Terraform. Path filtering lives here (not on
  # the workflow trigger) so the workflow always runs and the required check
  # below always reports — a workflow skipped by a top-level paths filter would
  # leave a required check pending forever and block the merge.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - name: Detect Terraform changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            terraform:
              - 'terraform/**'
              - '.terraform-version'
              - '.github/workflows/ci-terraform.yml'

  # Credential-free check that every component initialises and validates. This
  # replaces template-terraform-root's `test` job: that runs the module's
  # tftest.hcl files against a mocked provider, and there are none here yet.
  # Add a `test` job alongside this one when components grow tests.
  #
  # Matrixed over components rather than environments — the template's axis is
  # dev/stg/prd against one module; here each component is its own root config.
  validate:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component: [management, governance, connectivity, landingzones]
    defaults:
      run:
        working-directory: terraform/${{ matrix.component }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Resolve Terraform version
        id: tfversion
        run: echo "version=$(cat "$GITHUB_WORKSPACE/.terraform-version")" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ steps.tfversion.outputs.version }}
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false -backend=false

      - name: Terraform validate
        run: terraform validate -no-color

  # Plans each component against Azure using GitHub OIDC. Skipped until the
  # AZURE_CLIENT_ID repository variable is set (see README), so a fresh clone does
  # not fail this check before Azure auth is configured.
  #
  # IMPORTANT: a plan is only meaningful once the component's dependencies have
  # been applied at least once. Components resolve each other with data sources
  # keyed off the naming convention (see the repo README), and a data source for a
  # resource that does not exist yet fails at plan time — so `governance` fails
  # until `management` is applied, and `landingzones` fails until `connectivity`
  # is. fail-fast is off so each leg reports independently rather than one missing
  # dependency masking the rest. Apply order is management → governance →
  # connectivity → landingzones.
  plan:
    needs: changes
    if: needs.changes.outputs.terraform == 'true' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component: [management, governance, connectivity, landingzones]
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: terraform/${{ matrix.component }}
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Resolve Terraform version
        id: tfversion
        run: echo "version=$(cat "$GITHUB_WORKSPACE/.terraform-version")" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ steps.tfversion.outputs.version }}
          terraform_wrapper: false

      # No backend block is committed, so state is local to the runner and this
      # plan is throwaway — it proves the config resolves against real Azure, not
      # what a real apply would change. Point this at a backend once one exists.
      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        run: terraform plan -input=false -no-color

  # Single required status check for branch protection. Always runs, and fails
  # only if validate or plan actually failed — skipped (no Terraform changes, or
  # Azure auth not configured) counts as success, so non-Terraform PRs are not
  # blocked. Mark this check ("ci-terraform") required in the ruleset.
  ci-terraform:
    needs: [validate, plan]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify Terraform jobs
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
        run: |
          echo "validate=$VALIDATE_RESULT plan=$PLAN_RESULT"
          if [ "$VALIDATE_RESULT" = "failure" ] || [ "$PLAN_RESULT" = "failure" ]; then
            echo "::error::A Terraform job failed."
            exit 1
          fi
