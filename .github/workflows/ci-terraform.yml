name: ci-terraform

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Credential-free init + validate of every component, via the shared workflow.
  # The path filter and the always-reporting gate job both live in there — mark
  # "terraform / Terraform" as the required check in the ruleset, not the bare
  # job id, the same way ci-pre-commit reports as "pre-commit / Pre-commit".
  #
  # There is no plan job: components are applied by hand against remote state,
  # and a CI plan would need an identity with read across the subscription that
  # nothing currently vends. See README.
  terraform:
    permissions:
      contents: read
      pull-requests: read
    # TODO: re-pin to the released tag's SHA once jay-withers/workflows has cut
    # a release containing the validate-only terraform.yml.
    uses: jay-withers/workflows/.github/workflows/terraform.yml@main
    with:
      # Listed in apply order (management → governance → connectivity →
      # landingzones, with bootstrap standing alone) to read against the
      # README. validate does not depend on the order — each leg is
      # independent and inits with -backend=false.
      directories: '["terraform/management", "terraform/governance", "terraform/connectivity", "terraform/landingzones", "terraform/bootstrap"]'
